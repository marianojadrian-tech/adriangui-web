<!doctype html>
<!--
  LANDING PROVISIONAL — reemplázala por tu diseño real.
  Para cambiarla: exporta tu landing desde Claude Design y sustituye este index.html
  (y sube los archivos que acompañen, p. ej. un support.js, junto a este archivo en la raíz).
  Las apps privadas viven en subcarpetas: /tareas/ , y las que agregues después.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adrián Guilarte</title>
<style>
  :root {
    --bg: #f4f3ef;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #dcdad2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --fg: #ededed;
      --muted: #9a9a9a;
      --line: #2c2c2c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    line-height: 1.5;
  }
  main { max-width: 34rem; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }
  p { color: var(--muted); font-size: 1.05rem; margin: 0 0 2rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  a.btn {
    display: inline-block;
    padding: 0.6rem 1.1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
    transition: border-color .15s ease;
  }
  a.btn:hover { border-color: var(--fg); }
  footer { margin-top: 3rem; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Adrián Guilarte</h1>
  <p>Sitio en construcción. Muy pronto vas a ver algo aquí.</p>
  <div class="links">
    <a class="btn" href="mailto:marianojadrian@gmail.com">Escribime</a>
  </div>
  <footer>© <span id="y"></span> Adrián Guilarte</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
